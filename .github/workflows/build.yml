name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build standalone application
        run: dotnet publish windows/Teleprompter.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o dist
      - name: Test Windows x64 application
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$pwd/dist/Teleprompter.exe" -ArgumentList '--smoke-test' -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Smoke test timed out' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path smoke-test-error.txt) { Get-Content smoke-test-error.txt }
            throw "Smoke test failed: $($p.ExitCode)"
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/Teleprompter.exe,README.md -DestinationPath Teleprompter-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Teleprompter-${{ matrix.rid }}
          path: Teleprompter-${{ matrix.rid }}.zip
